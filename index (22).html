<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tillfy Restaurant</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2347">
<style>
:root {
  --bg:#ffffff;
  --card:#f0f4ff;
  --card2:#e2e8f7;
  --line:#d0d8ee;
  --ink:#1a2347;
  --mute:#6b7599;
  --g:#1a9e5f;
  --r:#d03a3a;
  --orange:#1a2347;
  --orange2:#2a3a6e;
  --accent:#1a2347;
  --pill:#1a2347;
  --radius:10px;
  --sh:0 2px 12px rgba(26,35,71,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overflow:hidden;}
#wrap{display:flex;flex-direction:column;height:100%;}

/* ── HEADER ── */
#hdr{background:linear-gradient(135deg,#1a2347 0%,#2a3a6e 100%);padding:0 16px;display:flex;align-items:center;gap:10px;min-height:52px;flex-shrink:0;position:relative;box-shadow:0 2px 12px rgba(26,35,71,.3);}
#hdr-inner{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
#hName{font-size:20px;font-weight:900;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hSub{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;white-space:nowrap;margin-left:auto;}
#hmb{cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:4px;background:none;border:none;color:#fff;}
#hmb span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;}
#dlg{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);align-items:center;justify-content:center;}
#dlg.show{display:flex;}
#dlg-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px;max-width:340px;width:90%;box-shadow:var(--sh);}
#dT{font-size:17px;font-weight:800;margin-bottom:8px;}
#dM{font-size:14px;color:var(--mute);margin-bottom:20px;line-height:1.5;}
#dlg-btns{display:flex;gap:10px;}
#dYes{flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
#dNo{flex:1;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e2b4a;color:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:9998;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── DRAWER ── */
#drw{position:fixed;inset:0;z-index:9000;display:none;}
#drw.show{display:block;}
#drw-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
#drw-panel{position:absolute;left:0;top:0;bottom:0;width:260px;background:var(--card);border-right:1.5px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;}
#dName{font-size:18px;font-weight:900;padding:20px 18px 6px;color:var(--orange);}
#drw-panel .dsub{font-size:11px;padding:0 18px 14px;color:var(--mute);font-weight:600;}
#dLinks div{padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;border-left:3px solid transparent;transition:.15s;}
#dLinks div:hover,#dLinks div.on{background:var(--card2);color:var(--orange);border-left-color:var(--orange);}
#dLinks .ddiv{height:1px;background:var(--line);margin:6px 0;}
#dLinks .dg{color:var(--mute);}

/* ── NAV BAR (mobile) ── */
nav{display:flex;background:var(--card);border-top:1.5px solid var(--line);flex-shrink:0;}
nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 6px;cursor:pointer;gap:3px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--mute);transition:.15s;border-top:2px solid transparent;}
nav div.on{color:var(--orange);border-top-color:var(--orange);}
nav div svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── CONTENT ── */
#sb-topbar{display:none;}
#app{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch;}
#app.wide{padding:0;}
#app.noscroll{overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;}
#scr{display:flex;flex-direction:column;flex:1;overflow:hidden;}

/* ── DESKTOP SIDEBAR ── */
#sidebar{display:none;}
@media(min-width:768px){
  #wrap{flex-direction:row;}
  #hdr{display:none;}
  #hmb{display:none;}
  nav{display:none;}
  #drw{display:none!important;}
  #sidebar{
    display:flex;flex-direction:column;width:90px;flex-shrink:0;align-items:center;
    background:#1a2347;
    height:100%;overflow-y:auto;padding:0 0 16px;
  }
  #sb-logo{padding:18px 0 14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1);width:100%;margin-bottom:8px;}
  #sb-logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#27c17a,#1a9e5f);border-radius:12px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;}
  #sb-logo-icon svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  #sb-logo-name{font-size:9px;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.8px;text-transform:uppercase;}
  #sb-logo-sub{display:none;}
  #sb-nav{flex:1;display:flex;flex-direction:column;gap:4px;width:100%;padding:4px 10px;}
  .sb-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:11px 6px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:.15s;}
  .sb-link:hover{background:rgba(255,255,255,.08);}
  .sb-link:hover svg{stroke:rgba(255,255,255,.85)!important;}
  .sb-link:hover span{color:rgba(255,255,255,.8)!important;}
  .sb-link.on{background:rgba(255,255,255,.12);border-color:rgba(39,193,122,.4);}
  .sb-link.on svg{stroke:#27c17a!important;}
  .sb-link.on span{color:#27c17a!important;}
  .sb-link svg{width:26px;height:26px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sb-link span{font-size:9px;font-weight:800;color:rgba(255,255,255,.45);letter-spacing:.5px;text-transform:uppercase;}
  #sb-footer{margin-top:auto;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;}
  #sb-footer b{display:none;}
  #sb-acct-role{display:none;}
  #sb-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,.15);}
  #scr{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  /* desktop top bar */
  #sb-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;background:#fff;border-bottom:1.5px solid #e0e6f0;flex-shrink:0;}
  #sb-topbar h2{font-size:19px;font-weight:900;color:#1a2347;}
  #sb-topbar-right{display:flex;align-items:center;gap:12px;}
}

/* ── BUTTONS ── */
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:.15s;text-align:center;}
.btn:active{transform:scale(.97);}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
.btn.g{background:#1e7a4e;}
.btn.r,.btn.danger{background:#9a2a2a;}
.btn.orange{background:linear-gradient(180deg,#2a3a6e 0%,#1a2347 100%);box-shadow:0 4px 14px rgba(26,35,71,.35),inset 0 1px 0 rgba(255,255,255,.15);}
.btn.mini{padding:7px 12px;font-size:12px;}
.btn.full{width:100%;}
.btn.big{padding:16px;font-size:15px;}
.chip{background:var(--card);color:var(--mute);border:1.5px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:.15s;}
.chip.on{background:var(--accent);color:#fff;}
input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font-size:14px;font-family:inherit;width:100%;transition:.15s;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--card);}
label{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
.frow{margin-bottom:14px;}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;}
.itm{cursor:pointer;transition:.12s;}
.itm:active{opacity:.8;}
h1{font-size:20px;font-weight:900;letter-spacing:.5px;margin-bottom:12px;}
h2{font-size:16px;font-weight:800;margin-bottom:10px;}
.alert{background:#2a1a1a;border:1.5px solid #5a2a2a;border-radius:10px;padding:12px 14px;font-size:13px;color:#ff9a9a;margin-top:10px;}
.mute{color:var(--mute);}
.row{display:flex;align-items:center;gap:10px;}
hr{border:none;border-top:1.5px solid var(--line);margin:12px 0;}

/* ── ORDERS LAYOUT ── */
.ordwrap{padding:0;}
#app.noscroll .ordwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.oc{padding-bottom:12px;}

/* ── BILL LAYOUT (ROBOTILL style) ── */
.bill-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden;background:#f5f0e8;}
.bill-top-bar{background:#1a2347;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:46px;}
.bill-info-bar{background:#e8e4dc;padding:5px 12px;font-size:11px;color:#1a2347;flex-shrink:0;border-bottom:1px solid #ccc8c0;display:flex;gap:12px;flex-wrap:wrap;}
.bill-main{display:flex;flex:1;overflow:hidden;}
.bill-cats{width:100px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:6px 5px;overflow-y:auto;background:#e0dbd2;}
.bill-cat-btn{background:#1a2347;border:none;border-radius:8px;padding:10px 6px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:.3px;box-shadow:0 2px 0 #0a1020,0 3px 6px rgba(0,0,0,.25);line-height:1.2;touch-action:manipulation;}
.bill-cat-btn.on{background:#2a5aa8;}
.bill-items{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:6px;}
.bill-right{width:260px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:#f0ece4;border-left:2px solid #ccc8c0;}
.bill-sale-total{background:#1a2347;color:#fff;padding:8px 14px;text-align:right;flex-shrink:0;}
.bill-action-row{display:flex;gap:3px;padding:5px 6px;flex-shrink:0;background:#e0dbd2;border-bottom:1px solid #ccc8c0;}
.bill-act-btn{flex:1;background:#1a2347;border:none;border-radius:7px;padding:8px 4px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 0 #0a1020;touch-action:manipulation;}
.bill-act-btn.active{background:#2a5aa8;}
.order-table{flex:1;overflow-y:auto;}
.order-row{display:flex;align-items:center;padding:6px 8px;border-bottom:1px solid #d8d4cc;cursor:pointer;font-size:11px;}
.order-row.selected{background:#3a6fd8;color:#fff;}
.order-row .or-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.order-row .or-price{width:44px;text-align:right;font-weight:700;}
.order-row .or-qty{width:28px;text-align:center;font-weight:800;}
.order-row .or-sub{width:48px;text-align:right;font-weight:800;}
.bill-controls{display:flex;gap:4px;padding:5px 6px;flex-shrink:0;border-top:1px solid #ccc8c0;border-bottom:1px solid #ccc8c0;background:#e8e4dc;}
.bill-ctrl-btn{flex:1;background:#1a2347;border:none;border-radius:7px;padding:9px 4px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 2px 0 #0a1020;touch-action:manipulation;}
.bill-totals{padding:6px 10px;font-size:11px;background:#e8e4dc;flex-shrink:0;}
.bill-totals-row{display:flex;justify-content:space-between;padding:2px 0;color:#555;}
.bill-totals-row.total{font-size:13px;font-weight:900;color:#1a2347;border-top:1px solid #ccc8c0;margin-top:3px;padding-top:4px;}

/* ── NUMPAD ── */
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.npbtn{background:var(--card2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:22px;font-weight:800;padding:16px;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.12s;border:none;}
.npbtn:active{transform:scale(.95);background:var(--accent);color:#fff;}
.npbtn.del{font-size:14px;}

/* ── OWNER MENU TILES ── */
.owner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.owner-tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.owner-tile:active{transform:scale(.96);}
.owner-tile .ot-ico{font-size:28px;margin-bottom:8px;}
.owner-tile .ot-lbl{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--ink);line-height:1.3;}

/* ── KITCHEN ── */
.kt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.kt-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;}

/* ── HISTORY ── */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.hist-row:last-child{border-bottom:none;}
.hist-row:hover{background:var(--card2);}

/* ── STATS TILES ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.stat-tile{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;}
.stat-tile .st-lbl{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.stat-tile .st-val{font-size:22px;font-weight:900;margin-top:4px;}
.st-g{color:var(--g);}
.st-r{color:var(--r);}

/* ── MENU GRID (ROBOTILL style) ── */
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:8px;padding:8px;overflow-y:auto;flex:1;align-content:start;}
.menu-tile{background:#1a2347;border:none;border-radius:12px;padding:0;cursor:pointer;text-align:left;box-shadow:0 3px 0 #0a1020,0 4px 8px rgba(0,0,0,.3);transition:.1s;touch-action:manipulation;overflow:hidden;}
.menu-tile:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1020,0 2px 4px rgba(0,0,0,.2);}
.menu-tile{position:relative;height:200px;}
.menu-tile .mt-img-wrap{position:absolute;inset:0;}
.menu-tile .mt-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.menu-tile .mt-img-ph{width:100%;height:100%;background:linear-gradient(135deg,#2a3a6e,#1a2347);display:flex;align-items:center;justify-content:center;}
.menu-tile .mt-body{position:absolute;bottom:0;left:0;right:0;padding:6px 8px 8px;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 70%,transparent 100%);border-top:1.5px solid rgba(255,255,255,.12);}
.menu-tile .mt-name{font-size:10px;font-weight:800;line-height:1.2;color:#fff;text-transform:uppercase;word-break:break-word;}
.menu-tile .mt-price{font-size:13px;font-weight:900;color:#27c17a;margin-top:2px;}
.menu-tile.selected{background:#2a5aa8;}

/* ── RECEIPT / SLIP ── */
.receipt{background:#fff;color:#111;border-radius:10px;padding:20px;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;max-width:340px;margin:0 auto;}
.receipt h3{text-align:center;font-size:15px;font-weight:900;margin-bottom:4px;}
.receipt hr{border:none;border-top:1px dashed #aaa;margin:8px 0;}
.receipt .total{font-size:14px;font-weight:900;}

/* PWA loading */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:16px;}
#splash svg{width:60px;height:60px;}
#splash .sp-t{font-size:28px;font-weight:900;color:var(--orange);}
#splash .sp-s{font-size:13px;color:var(--mute);}
</style>
</head>
<body>
<div id="splash">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="60" height="60" rx="14" fill="url(#sg)"/>
    <defs><linearGradient id="sg" x1="0" y1="0" x2="60" y2="60"><stop stop-color="#e8835a"/><stop offset="1" stop-color="#d4634a"/></linearGradient></defs>
    <path d="M15 20h30M15 30h20M15 40h25" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="sp-t">Tillfy Restaurant</div>
  <div class="sp-s">Loading…</div>
</div>

<div id="wrap" style="display:none">
  <div id="hdr">
    <div id="hdr-inner">
      <div>
        <div id="hName">Tillfy Restaurant</div>
        <div id="hSub"></div>
      </div>
    </div>
    <button id="hmb" onclick="showDrawer()">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div id="sidebar">
    <div id="sb-logo">
      <div id="sb-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M3 2h18M3 2v14a2 2 0 002 2h14a2 2 0 002-2V2M9 22v-4M15 22v-4M9 18h6"/></svg>
      </div>
      <div id="sb-logo-name">Tillfy</div>
      <div id="sb-logo-sub"></div>
    </div>
    <div id="sb-nav">
      <div class="sb-link" id="sbn-home" onclick="go('home')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Today</span>
      </div>
      <div class="sb-link" id="sbn-orders" onclick="go('orders')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        <span>Bills</span>
      </div>
      <div class="sb-link" id="sbn-custs" onclick="go('custs')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Customers</span>
      </div>
      <div class="sb-link" id="sbn-history" onclick="go('history')">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>History</span>
      </div>
      <div class="sb-link" id="sbn-settings" onclick="go('settings')">

function calc(p) {
  var cost = 0, sold = 0, staff = 0, waste = 0, rev = 0, covered = 0, run = 0, i;
  for (i = 0; i < p.items.length; i++) cost += num(p.items[i].cost);
  for (i = 0; i < p.ev.length; i++) {
    var e = p.ev[i];
    if (e.k === 's') { sold++; rev += e.p; run += e.p; if (!covered && run >= cost) covered = sold; }
    else if (e.k === 'm') staff++; else waste++;
  }
  var planned = p.planned || 0, cpp = planned ? cost / planned : 0, expLeft = planned - sold - staff - waste;
  var o = { cost: cost, sold: sold, staff: staff, waste: waste, rev: rev, planned: planned, cpp: cpp, expLeft: expLeft, profit: rev - cost, covered: covered };
  if (p.status === 'closed') { o.left = p.left; o.missing = Math.max(0, expLeft - p.left); o.extra = Math.max(0, p.left - expLeft); o.lost = (waste + o.missing) * cpp; o.made = sold + staff + waste + p.left; }
  return o;
}

function addToTab(tab, item) {
  var l=null,i;
  for(i=0;i<tab.lines.length;i++) if(tab.lines[i].mid===item.id) l=tab.lines[i];
  if(!l){l={mid:item.id,name:item.name,price:item.price,cost:item.cost==null?null:item.cost,qty:0,at:Date.now()};tab.lines.push(l);}
  l.qty++;tab.ready=false;tab.served=false;
  var p=potFor(item);
  if(p) p.ev.push({k:'s',p:l.price,t:Date.now(),tab:tab.id,mid:item.id,i:eaid()});
  return p;
}
function removeFromTab(tab,mid) {
  var l=null,i;
  for(i=0;i<tab.lines.length;i++) if(tab.lines[i].mid===mid) l=tab.lines[i];
  if(!l) return;
  var bp=null,bi=-1,bt=-1;
  S.pots.forEach(function(p){p.ev.forEach(function(e,ix){if(e.tab===tab.id&&e.mid===mid&&e.t>bt){bt=e.t;bp=p;bi=ix;}});});

  l.qty--;
  if(l.qty<=0) tab.lines=tab.lines.filter(function(x){return x!==l;});
}
function lineCost(l) {
  if(l.cost!=null) return l.cost;
  for(var i=0;i<S.menu.length;i++) if(S.menu[i].id===l.mid&&!S.menu[i].pot&&S.menu[i].cost!=null) return S.menu[i].cost;
  return null;

function otherSales(filter) {
  var m={},o={sales:0,cost:0,profit:0,n:0,items:{},unkSales:0,unk:{}};
  S.pots.forEach(function(p){p.ev.forEach(function(e){if(e.tab){var k=e.tab+'|'+e.mid;m[k]=(m[k]||0)+1;}});});
  S.tabs.forEach(function(t){
    if(t.status==='void'||!filter(t.start)) return;
    t.lines.forEach(function(l){
      var q=l.qty-(m[t.id+'|'+l.mid]||0);
      if(q<=0) return;
      var cst=lineCost(l);
      o.sales+=q*l.price;o.n+=q;
      if(cst==null){o.unkSales+=q*l.price;o.unk[l.name]=true;}
      else{o.cost+=q*cst;o.profit+=q*(l.price-cst);}
      var it=o.items[l.name]||(o.items[l.name]={n:l.name,q:0,sales:0});
      it.q+=q;it.sales+=q*l.price;
    });
  });
  return o;
}

/* ---- HISTORY ---- */
function vHistory() {
  var today=Date.now();
  var filters=[['today','Today'],['week','This week'],['month','This month'],['all','All time']];
  function filt(ts){
    var d=new Date(ts),now=new Date(today);
    if(range==='today') return sameDay(ts,today);
    if(range==='week'){var s=new Date(now);s.setDate(now.getDate()-now.getDay());return d>=s;}
    if(range==='month') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;
  }
  var tabs=S.tabs.filter(function(t){return t.status==='paid'&&filt(t.paid||t.start);}).sort(function(a,b){return b.paid-a.paid;});
  var rev=tabs.reduce(function(s,t){return s+tabTotal(t);},0);
  var h='<div class="ordwrap" style="display:flex;flex-direction:column;height:100%;overflow:hidden">';
  /* FIXED: title */
  h+='<h1 style="flex-shrink:0;margin-bottom:10px">History</h1>';
  /* FIXED: filter chips */
  h+='<div style="display:flex;gap:8px;flex-wrap:nowrap;margin-bottom:12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
  filters.forEach(function(f){h+='<button class="chip'+(range===f[0]?' on':'')+'" data-act="range" data-v="'+f[0]+'">'+f[1]+'</button>';});
  h+='</div>';
  /* FIXED: stats strip */
  h+='<div class="card" style="margin-bottom:12px;display:flex;gap:20px;padding:14px 18px;flex-shrink:0">';
  h+='<div><div class="st-lbl">Total Revenue</div><div class="st-val st-g">'+money(rev)+'</div></div>';
  h+='<div><div class="st-lbl">Bills</div><div class="st-val">'+tabs.length+'</div></div>';
  h+='<div><div class="st-lbl">Avg</div><div class="st-val">'+(tabs.length?money(rev/tabs.length):money(0))+'</div></div>';
  h+='</div>';
  if(!tabs.length){h+='<div style="color:var(--mute);padding:20px 0;flex-shrink:0">No paid bills for this period.</div>';return h+'</div>';}
  /* SCROLLABLE: rows */
  h+='<div class="card" style="overflow-y:auto;flex:1;min-height:0;padding-bottom:20px;border:2px solid var(--line)">';
  tabs.forEach(function(t,i){
    h+='<div class="hist-row" data-act="openTab" data-id="'+t.id+'">';
    h+='<div><div style="font-size:14px;font-weight:800;text-transform:uppercase">'+esc(t.name||t.label||'')+'</div><div style="font-size:11px;color:var(--mute);margin-top:2px">'+dstr(t.paid)+'  '+tstr(t.paid)+' · '+(t.method||'')+'</div></div>';
    h+='<div style="font-size:16px;font-weight:900">'+money(tabTotal(t))+'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h+'</div>';
}

    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:pass})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error||!d.access_token) throw new Error(d.error_description||d.error||'Invalid email or password.');
    var token=d.access_token;
    var uid=d.user&&d.user.id;
    /* Step 2: Look up their cashier record to get role + restaurant */
    return fetch(SUPA_URL+'/rest/v1/pp_cashiers?user_id=eq.'+uid+'&select=name,restaurant_id',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}
    })
    .then(function(r){return r.json();})
    .then(function(cashiers){
      if(!Array.isArray(cashiers)||!cashiers[0]) throw new Error('No cashier profile found. Contact your administrator.');
      var c=cashiers[0];
      /* Step 3: Get restaurant name */
      var rid=c.restaurant_id;
      return fetch(SUPA_URL+'/rest/v1/pp_restaurants?id=eq.'+rid+'&select=name,shop_code',{
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}
      })
      .then(function(r){return r.json();})
      .then(function(rests){
        var rest=Array.isArray(rests)&&rests[0];
        acct={
          uid:uid,
          token:token,
          role:'owner',
          name:(c.name)||email,
          rid:rid||'',
          rname:(rest&&rest.name)||'My Restaurant',
          shop_code:(rest&&rest.shop_code)||''
        };
        if(rest&&rest.name) S.biz=rest.name;
        save();
        try{localStorage.setItem('qs_acct',JSON.stringify(acct));}catch(e){}
        render();
      });
    });
  })
  .catch(function(e){
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    if(err){err.textContent=e.message||'Sign in failed.';err.style.display='block';}
  });
}

function doCashierLogin() {
  var pd=document.getElementById('pin-dots');
  var pin=pd?pd.getAttribute('data-pin')||'':'';
  var err=document.getElementById('a-err');
  var btn=document.getElementById('a-btn');
  if(pin.length!==4){if(err){err.textContent='Enter your 4-digit PIN.';err.style.display='block';}return;}
  if(btn){btn.textContent='Signing in…';btn.disabled=true;}
  if(err) err.style.display='none';
  /* Look up cashier by PIN across all restaurants */
  fetch(SUPA_URL+'/rest/v1/pp_cashiers?pin_hash=eq.'+encodeURIComponent(pin)+'&removed=eq.false&select=name,restaurant_id,user_id',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  })
  .then(function(r){return r.json();})
  .then(function(cashiers){
    if(!Array.isArray(cashiers)||!cashiers[0]) throw new Error('PIN not found. Contact your administrator.');
    var c=cashiers[0];
    var rid=c.restaurant_id;
    return fetch(SUPA_URL+'/rest/v1/pp_restaurants?id=eq.'+rid+'&select=name,shop_code',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    })
    .then(function(r){return r.json();})
    .then(function(rests){
      var rest=Array.isArray(rests)&&rests[0];
      acct={
        uid:c.user_id||'cashier',
        token:'',
        role:'cashier',
        name:c.name||'Cashier',
        rid:rid||'',
        rname:(rest&&rest.name)||'My Restaurant',
        shop_code:(rest&&rest.shop_code)||''
      };
      if(rest&&rest.name) S.biz=rest.name;
      save();
      try{localStorage.setItem('qs_acct',JSON.stringify(acct));}catch(e){}
      render();
    });
  })
  .catch(function(e){
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    if(err){err.textContent=e.message||'Sign in failed.';err.style.display='block';}
  });
}

document.addEventListener('click',function(e){
  var el=e.target;
  while(el&&el!==document.body){
    var act=el.getAttribute&&el.getAttribute('data-act');
    var id=el.getAttribute&&el.getAttribute('data-id');
    var v=el.getAttribute&&el.getAttribute('data-v');
    if(!act){el=el.parentNode;continue;}

    if(act==='loginTab'){loginTab=v||'owner';render();return;}
    if(act==='pinKey'){
      var pd=document.getElementById('pin-dots');
      if(!pd) return;
      var cur=pd.getAttribute('data-pin')||'';
      if(v==='⌫'){cur=cur.slice(0,-1);}
      else if(cur.length<4){cur+=v;}
      pd.setAttribute('data-pin',cur);
      for(var pi=0;pi<4;pi++){var dot=document.getElementById('pd'+pi);if(dot)dot.style.background=pi<cur.length?'var(--orange)':'var(--bg)';}
      return;
    }
    if(act==='doCashierLogin'){doCashierLogin();return;}
    if(act==='showAddCashier'){view.addCashier=true;render();return;}
    if(act==='hideAddCashier'){view.addCashier=false;render();return;}
    if(act==='saveCashier'){
      var cn=(document.getElementById('c-name')||{}).value||'';
      var cp=String((document.getElementById('c-pin')||{}).value||'').trim();
      var cerr=document.getElementById('c-err');
      cn=cn.trim();
      if(!cn||!cp){if(cerr){cerr.textContent='Enter name and PIN.';cerr.style.display='block';}return;}
      if(!/^\d{4}$/.test(cp)){if(cerr){cerr.textContent='PIN must be exactly 4 digits.';cerr.style.display='block';}return;}
      if(!S.cashiers) S.cashiers=[];
      if(S.cashiers.some(function(x){return x.pin===cp;})){if(cerr){cerr.textContent='That PIN is already in use.';cerr.style.display='block';}return;}
      S.cashiers.push({id:uid(),name:cn,pin:cp});
      save();view.addCashier=false;render();
      /* Also save to Supabase if owner has token */
      if(acct&&acct.token&&acct.rid){
        fetch(SUPA_URL+'/rest/v1/pp_cashiers',{
          method:'POST',
          headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+acct.token,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({restaurant_id:acct.rid,name:cn,pin_hash:cp,removed:false})
        }).catch(function(){});
      }
      return;
    }
    if(act==='delCashier'){
      if(!S.cashiers) return;
      S.cashiers=S.cashiers.filter(function(c){return c.id!==id;});
      save();render();return;
    }
    if(act==='doLogin'){doLogin();return;}
    if(act==='asignout'){ask('Sign Out','Sign out of your account?','Sign Out',signOut,'Cancel');return;}
    if(act==='openTab'){
      var t=tabById(id);
      if(!t) return;
      if(t.status==='paid'){go('slip',id);}
      else{billCat='All';go('bill',id);}
      return;
    }
    if(act==='newTab'){
      var nm=(document.getElementById('f-name')||{}).value;
      nm=(nm||'').trim().toUpperCase();
      if(!nm){toast('Enter a tab name.');return;}
      var nt={id:uid(),name:nm,label:nm,start:Date.now(),status:'open',lines:[],cust:null};
      S.tabs.push(nt);save();billCat='All';view.newBill=false;go('bill',nt.id);return;
    }
    if(act==='ofil'){ofil=v||'all';render();return;}
    if(act==='range'){range=v||'today';render();return;}
    if(act==='bcat'){billCat=v||'All';render();return;}
    if(act==='addItem'){
      var t2=tabById(view.id); var m2=null;
      for(var i=0;i<S.menu.length;i++) if(S.menu[i].id===id){m2=S.menu[i];break;}
      if(t2&&m2){addToTab(t2,m2);save();render();}return;
    }
    if(act==='addItemId'){
      var t3=tabById(view.id); var m3=null;
      for(var i=0;i<S.menu.length;i++) if(S.menu[i].id===id){m3=S.menu[i];break;}
      if(t3&&m3){addToTab(t3,m3);save();render();}return;
    }
    if(act==='decItem'){
      var t4=tabById(view.id); var mid=el.getAttribute('data-mid');
      if(t4&&mid){removeFromTab(t4,mid);save();render();}return;
    }
    if(act==='payBill'){payAmt='';payMethod='Cash';go('order',view.id);return;}
    if(act==='goBack'){go('bill',view.id);return;}
    if(act==='goOrders'){go('orders');return;}
    if(act==='numpad'){
      var k=el.getAttribute('data-k');
      if(k==='del'){payAmt=payAmt.slice(0,-1);}
      else if(k==='.'){if(!payAmt.includes('.')) payAmt+=k;}
      else{if(payAmt.length<8) payAmt+=k;}
      render();return;
    }
    if(act==='numpadExact'){var t5=tabById(view.id);if(t5) payAmt=String(tabTotal(t5));render();return;}
    if(act==='payMethod'){payMethod=v||'Cash';render();return;}
    if(act==='confirmPay'){
      var t6=tabById(view.id);
      if(!t6) return;
      var amt=num(payAmt)||tabTotal(t6);
      t6.status='paid';t6.paid=Date.now();t6.method=payMethod;t6.tendered=amt;
      save();payAmt='';go('slip',t6.id);return;
    }
    if(act==='sendKitchen'){
      var t7=tabById(view.id);
      if(t7){t7.lines.forEach(function(l){l.ktchn=true;});save();toast('Sent to kitchen.');render();}return;
    }
    if(act==='markReady'){
      var t8=tabById(id);
      if(t8){t8.ready=true;save();toast('Marked ready.');render();}return;
    }
    if(act==='voidBill'){
      ask('Void Bill','Void this bill? This cannot be undone.','Void',function(){
        var t9=tabById(view.id);if(t9){t9.status='void';save();go('orders');}
      });return;
    }
    if(act==='kitchen'){go('kitchen');return;}
    if(act==='goMenu'){go('menu');return;}
    if(act==='goHistory'){go('history');return;}
    if(act==='goSettings'){go('settings');return;}
    if(act==='goOwner'){go('ownermenu');return;}
    if(act==='goCashup'){go('cashup');return;}
    if(act==='goAcctPay'){go('acctpay');return;}
    if(act==='goCusts'){go('custs');return;}
    if(act==='goReprint'){go('reprint');return;}
    if(act==='goVoid'){go('orders');return;}
    if(act==='goBack2'){go('bill',view.id);return;}
    if(act==='saveBiz'){
      S.biz=(document.getElementById('s-biz')||{}).value||S.biz;
      S.addr=(document.getElementById('s-addr')||{}).value||'';
      S.cur=(document.getElementById('s-cur')||{}).value||'R';
      S.kit=!!(document.getElementById('s-kit')||{}).checked;
      save();toast('Settings saved.');render();return;
    }
    if(act==='cancelMenuItem'){mform=null;render();return;}
    if(act==='addMenuItem'){mform=blankM();render();return;}
    if(act==='editMenuItem'){
      for(var i=0;i<S.menu.length;i++) if(S.menu[i].id===id){mform=JSON.parse(JSON.stringify(S.menu[i]));break;}
      render();return;
    }
    if(act==='delMenuItem'){
      ask('Delete Item','Delete this menu item?','Delete',function(){
        S.menu=S.menu.filter(function(m){return m.id!==id;});save();render();
      });return;
    }
    if(act==='saveMenuItem'){
      var nm2=(document.getElementById('mi-name')||{}).value||'';
      var cat2=(document.getElementById('mi-cat')||{}).value||'Food';
      var price2=num((document.getElementById('mi-price')||{}).value);
      var costV=(document.getElementById('mi-cost')||{}).value;
      var cost2=costV.trim()===''?null:num(costV);
      var img2=(document.getElementById('mi-img-data')||{}).value||'';
      if(!nm2){toast('Enter item name.');return;}
      if(!price2){toast('Enter price.');return;}
      var existId=el.getAttribute('data-id');
      if(existId){
        for(var i=0;i<S.menu.length;i++) if(S.menu[i].id===existId){S.menu[i].name=nm2;S.menu[i].cat=cat2;S.menu[i].price=price2;S.menu[i].cost=cost2;S.menu[i].img=img2;break;}
      } else {
        S.menu.push({id:uid(),name:nm2,cat:cat2,price:price2,cost:cost2,img:img2,pot:false,at:Date.now()});
      }
      mform=null;save();toast(existId?'Item updated.':'Item added.');go('menu');return;
    }
    if(act==='newCust'){go('cform');return;}
    if(act==='openCust'){go('cust',id);return;}
    if(act==='editCust'){go('cform',id);return;}
    if(act==='saveCust'){
      var cn=(document.getElementById('cf-name')||{}).value||'';
      var cp=(document.getElementById('cf-phone')||{}).value||'';
      var ce=(document.getElementById('cf-email')||{}).value||'';
      var cno=(document.getElementById('cf-notes')||{}).value||'';
      var cid=el.getAttribute('data-id');
      if(!cn){toast('Enter customer name.');return;}
      if(cid){
        for(var i=0;i<S.custs.length;i++) if(S.custs[i].id===cid){S.custs[i].name=cn;S.custs[i].phone=cp;S.custs[i].email=ce;S.custs[i].notes=cno;break;}
        toast('Customer updated.');go('cust',cid);
      } else {
        S.custs.push({id:uid(),name:cn,label:cn,phone:cp,email:ce,notes:cno});
        toast('Customer added.');go('custs');
      }
      save();return;
    }
    if(act==='payAcct'){
      var c2=null;for(var i=0;i<S.custs.length;i++) if(S.custs[i].id===id){c2=S.custs[i];break;}
      if(!c2) return;
      var bal2=0;
      S.tabs.forEach(function(t){if(t.cust===c2.id&&t.status==='paid'&&t.method==='Account') bal2+=tabTotal(t);});
      S.led.forEach(function(e){if(e.cust===c2.id) bal2-=e.amt;});
      var amtStr=prompt('Payment from '+c2.name+'\nOutstanding: '+money(bal2)+'\n\nEnter amount:');
      if(amtStr===null) return;
      var amtPaid=num(amtStr);
      if(!amtPaid){toast('Invalid amount.');return;}
      S.led.push({id:uid(),cust:c2.id,amt:amtPaid,t:Date.now(),note:'Payment'});
      save();toast('Payment of '+money(amtPaid)+' recorded.');render();return;
    }
    if(act==='pickTab'){go('bill',id);return;}
    if(act==='data-go'||el.getAttribute('data-go')){var g=el.getAttribute('data-go');if(g){hideDrawer();go(g);return;}}

    el=el.parentNode;
  }
});

function handleImgPick(input) {
  var f = input.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX = 240;
      var w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
      else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      var d = c.toDataURL('image/jpeg', 0.75);
      document.getElementById('mi-img-data').value = d;
      var p = document.getElementById('mi-img-preview');
      p.innerHTML = '<img src="' + d + '" style="width:100%;height:100%;object-fit:cover">';
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}
